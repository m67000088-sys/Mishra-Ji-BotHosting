<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Panel</title>
<style>
:root{--ac:#4f8cff;--bg:#080c18;--s1:#0f1630;--s2:#162042;--bd:#243058;--tx:#e8ecf7;--mu:#8d97b5;--ok:#2fbf71;--er:#f2545b;--wa:#f5a623}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45;font-size:14.5px}
a{color:var(--ac)}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:14.5px;outline:none;font-family:inherit}
input[type=checkbox]{width:auto}
label{display:block;font-size:12.5px;color:var(--mu);margin:0 0 5px;font-weight:600}
button{font-family:inherit;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
button.g{background:var(--s2);border:1px solid var(--bd);color:var(--tx)}
button.r{background:color-mix(in srgb,var(--er) 18%,transparent);color:#ff8b90;border:1px solid color-mix(in srgb,var(--er) 40%,transparent)}
button.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.box{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.box h3{font-size:15px;margin-bottom:12px}
.mut{color:var(--mu);font-size:13px}
#app{display:none;min-height:100vh}
#sd{position:fixed;top:0;bottom:0;left:0;width:216px;background:var(--s1);border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:3px;overflow:auto}
#sd .lg{font-weight:800;font-size:16px;padding:6px 10px 14px}
#sd button{background:none;color:var(--mu);text-align:left;display:flex;gap:9px;align-items:center;font-weight:600;padding:10px 12px}
#sd button.on{background:var(--ac);color:#fff}#sd button:hover:not(.on){background:var(--s2)}
#sd .sp{flex:1}
#m{margin-left:216px;padding:22px;max-width:1100px}
#m>h2{font-size:22px;margin-bottom:16px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px}.stat .n{font-size:26px;font-weight:800}.stat .l{color:var(--mu);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{margin-bottom:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px}
.pill{font-size:11.5px;padding:2px 9px;border-radius:99px;font-weight:700;display:inline-block}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:#6ee7a4}
.pill.off{background:color-mix(in srgb,var(--mu) 25%,transparent);color:var(--mu)}
.pill.bad{background:color-mix(in srgb,var(--er) 18%,transparent);color:#ff9aa0}
.pill.wa{background:color-mix(in srgb,var(--wa) 18%,transparent);color:#ffd48a}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}
.sw{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;cursor:pointer}
.sw input{width:18px;height:18px}.sw b{display:block}.sw span{font-size:12.5px;color:var(--mu)}
.log{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13.5px}.log time{color:var(--mu);min-width:150px;font-size:12px}
pre.logbox{background:#050810;border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:12px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all}
#t{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:11px 18px;border-radius:12px;display:none;z-index:99;font-weight:600;box-shadow:0 8px 30px #0009;max-width:92vw}
#lg{max-width:370px;margin:12vh auto 0;padding:18px}
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:20px;width:min(560px,94vw)}dialog::backdrop{background:#000a}
code{background:var(--bg);border:1px solid var(--bd);padding:1px 6px;border-radius:6px;font-size:12.5px}
#tb{display:none}#ov{display:none}
@media(max-width:820px){
 #tb{display:flex;position:sticky;top:0;z-index:20;background:var(--s1);border-bottom:1px solid var(--bd);padding:10px 14px;align-items:center;gap:12px;font-weight:800}
 #sd{transform:translateX(-102%);transition:transform .22s;z-index:40;width:250px;box-shadow:12px 0 40px #000a}
 body.nav #sd{transform:none}body.nav #ov{display:block;position:fixed;inset:0;background:#0009;z-index:30}
 #m{margin:0;padding:16px 14px 60px}.grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="lg"><div class="box" style="padding:22px">
  <div style="font-size:34px">🔐</div><h2 style="margin:6px 0 4px">Admin Login</h2>
  <div id="envw" class="mut" style="color:#ffd48a;margin-bottom:10px"></div>
  <input id="pw" type="password" placeholder="Admin password" style="margin-bottom:12px">
  <button id="lb" style="width:100%">Login</button>
</div></div>

<div id="app">
  <div id="tb"><button class="g" id="mb">☰</button><span>⚡ Admin</span></div>
  <div id="ov"></div>
  <nav id="sd">
    <div class="lg">⚡ Admin Panel</div>
    <button data-p="o" class="on">📊 Overview</button>
    <button data-p="b">🤖 Bots</button>
    <button data-p="u">👥 Users</button>
    <button data-p="x">⚙️ Settings</button>
    <button data-p="a">🧾 Activity</button>
    <div class="sp"></div>
    <button id="home">🏠 Site dekho ↗</button>
    <button id="out">🚪 Logout</button>
  </nav>
  <main id="m"><h2 id="h"></h2><div id="v"></div></main>
</div>
<div id="t"></div>
<dialog id="dlg"></dialog>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=null,P='o',Q='';
const TITLES={o:'Overview',b:'Bots',u:'Users',x:'Settings',a:'Activity log'};
const SLABEL={running:['ok','🟢 Running'],stopped:['off','⚪ Stopped'],pending_approval:['wa','⏳ Pending approval'],crashed:['bad','❌ Crashed'],killed:['bad','⚠️ Killed (limit)'],installing:['wa','⏳ Installing']};

function toast(m,ok=true){const t=$('t');t.textContent=m;t.style.background=ok?'#1f8f55':'#c53a41';t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',2600)}
async function api(u,b){const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Error');e.status=r.status;throw e}return j}
const act=async(b,confirmMsg,msg)=>{if(confirmMsg&&!confirm(confirmMsg))return false;try{await api('/api/admin/action',b);toast(msg||'Ho gaya ✔');await load();return true}catch(e){toast(e.message,false);return false}};
const dt=t=>t?new Date(t*1000).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'–';

$('lb').onclick=async()=>{try{await api('/api/admin/login',{password:$('pw').value});$('pw').value='';init()}catch(e){toast(e.message,false)}};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('lb').click()};
$('out').onclick=async()=>{await api('/api/admin/login',{action:'logout'});location.reload()};
$('home').onclick=()=>window.open('/','_blank');
$('mb').onclick=()=>document.body.classList.toggle('nav');$('ov').onclick=()=>document.body.classList.remove('nav');
document.querySelectorAll('#sd button[data-p]').forEach(b=>b.onclick=()=>{P=b.dataset.p;Q='';document.body.classList.remove('nav');document.querySelectorAll('#sd button[data-p]').forEach(x=>x.classList.toggle('on',x===b));draw()});

async function init(){
  const j=await api('/api/admin/login').catch(()=>({}));
  const mi=j.env?.missing||[];$('envw').textContent=mi.length?'⚠ Missing: '+mi.join(', '):'';
  $('lg').style.display=j.admin?'none':'block';$('app').style.display=j.admin?'block':'none';
  if(j.admin)load();
}
async function load(){try{D=await api('/api/admin/data');draw()}catch(e){if(e.status===401)return init();toast(e.message,false)}}

const field=(id,label,val,ph='',type='text')=>'<div class="f"><label>'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(val)+'" placeholder="'+esc(ph)+'"></div>';
const toggle=(id,title,sub,on)=>'<label class="sw"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+'><div><b>'+title+'</b><span>'+sub+'</span></div></label>';
const gv=id=>{const e=$(id);return e.type==='checkbox'?e.checked:e.value};

function draw(){
  if(!D)return;$('h').textContent=TITLES[P];const s=D.settings;let h='';
  if(P==='o'){
    const t=D.totals;
    h+='<div class="g4">'+[['👥','Users',t.users],['🤖','Total bots',t.bots],['🟢','Chal rahe',t.running],['🐍','Python',t.python],['🟩','Node.js',t.node],['🚫','Banned',t.banned]].map(x=>'<div class="stat"><div class="n">'+x[2]+'</div><div class="l">'+x[0]+' '+x[1]+'</div></div>').join('')+'</div>';
    const running=D.bots.filter(b=>b.status==='running');
    h+='<div class="box"><h3>🟢 Abhi chal rahe bots</h3>'+(running.map(b=>'<div class="row sb" style="padding:6px 0;border-bottom:1px solid var(--bd)"><b>'+esc(b.name)+'</b><span class="mut">'+(b.runtime==='node'?'🟩':'🐍')+' @'+esc(b.owner)+' • CPU '+(b.cpu??'–')+'% • RAM '+(b.mem??'–')+'MB</span></div>').join('')||'<p class="mut">Koi nahi</p>')+'</div>';
    h+='<div class="box"><h3>🧾 Recent activity</h3>'+(D.logs.slice(0,6).map(l=>'<div class="log"><time>'+dt(l.t)+'</time><span>'+esc(l.msg)+'</span></div>').join('')||'<p class="mut">Kuch nahi</p>')+'</div>';
    const sv=D.server,rp=Math.round(sv.ramUsedMB/sv.ramTotalMB*100),dp=sv.disk.total?Math.round(sv.disk.used/sv.disk.total*100):0;
    const bar=(p,c)=>'<div style="height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin:6px 0 2px"><i style="display:block;height:100%;width:'+Math.min(100,p)+'%;background:'+(p>85?'var(--er)':c)+'"></i></div>';
    h+='<div class="box"><h3>🖥 Server</h3><div class="grid2"><div><div class="row sb"><span>RAM</span><b>'+sv.ramUsedMB+' / '+sv.ramTotalMB+' MB</b></div>'+bar(rp,'var(--ac)')+'<div class="row sb" style="margin-top:8px"><span>CPU</span><b>'+sv.cpuPercent+'%</b></div>'+bar(sv.cpuPercent,'var(--ok)')+'<div class="row sb" style="margin-top:8px"><span>Disk</span><b>'+dp+'%</b></div>'+bar(dp,'var(--wa)')+'</div>'+
      '<div class="mut" style="line-height:2">🐍 Python <b>'+esc(sv.python)+'</b><br>🟩 Node.js <b>'+esc(sv.node||'install nahi hai ⚠️')+'</b><br>🔒 Isolation: <b style="color:'+(sv.isolation.startsWith('per')?'#6ee7a4':'#ffd48a')+'">'+esc(sv.isolation)+'</b><br>⏱ Server uptime: <b>'+Math.floor(sv.uptimeSec/3600)+'h</b></div></div>'+
      (sv.isolation.startsWith('per')?'':'<p class="mut" style="margin-top:8px;color:#ffd48a">⚠️ Docker (root) se deploy karo, tabhi har bot alag Linux user se chalega.</p>')+'</div>';
    h+='<div class="box"><h3>Status</h3><div class="row">'+[['Upstash Redis',D.env.redis],['ADMIN_PASSWORD',D.env.adminPassword]].map(x=>'<span class="pill '+(x[1]?'ok':'bad')+'">'+(x[1]?'✔':'✖')+' '+x[0]+'</span>').join('')+(s.approvalRequired?'<span class="pill wa">⏳ Approval ON</span>':'')+(s.maintenance?'<span class="pill wa">🛠 Maintenance</span>':'')+'</div></div>';
  }
  if(P==='b'){
    const list=D.bots.filter(b=>(b.name+b.owner).includes(Q.toLowerCase()));
    h+='<input id="q" placeholder="🔍 bot/owner search" value="'+esc(Q)+'" style="max-width:320px;margin-bottom:12px">';
    h+='<div class="box tw"><table><tr><th>Bot</th><th>Type</th><th>Owner</th><th>Status</th><th>Usage</th><th>Restarts</th><th></th></tr>'+list.map(b=>{const st=SLABEL[b.status]||['off',b.status];
      return '<tr><td><b>'+esc(b.name)+'</b></td><td>'+(b.runtime==='node'?'🟩 Node':'🐍 Py')+'</td><td>@'+esc(b.owner)+'</td><td><span class="pill '+st[0]+'">'+st[1]+'</span></td><td>'+(b.cpu!==undefined?('CPU '+b.cpu+'% RAM '+b.mem+'MB'):'–')+'</td><td>'+(b.restarts||0)+'</td>'+
      '<td><div class="row">'+
      (b.status==='pending_approval'?'<button class="sm" data-approve="'+esc(b.name)+'">✅ Approve</button><button class="r sm" data-reject="'+esc(b.name)+'">❌ Reject</button>':
        (b.status==='running'?'<button class="g sm" data-stopbot="'+esc(b.name)+'">⏹ Stop</button>':'<button class="sm" data-startbot="'+esc(b.name)+'">▶ Start</button>'))+
      '<button class="g sm" data-logs="'+esc(b.name)+'">📜 Logs</button><button class="g sm" data-envk="'+esc(b.name)+'">🔐 Env</button><button class="r sm" data-delbot="'+esc(b.name)+'">🗑</button></div></td></tr>'}).join('')+'</table>'+(list.length?'':'<p class="mut" style="padding:12px">Koi bot nahi mila</p>')+'</div>';
  }
  if(P==='u'){
    const list=D.users.filter(u=>u.u.includes(Q.toLowerCase()));
    h+='<div class="row sb" style="margin-bottom:12px"><input id="q" placeholder="🔍 user search" value="'+esc(Q)+'" style="max-width:320px"></div>';
    h+='<div class="box tw"><table><tr><th>User</th><th>Joined</th><th>Bots</th><th>Limit</th><th>Status</th><th></th></tr>'+list.map(u=>'<tr><td><b>'+esc(u.u)+'</b></td><td>'+dt(u.created)+'</td><td>'+u.bots+'</td><td>'+(u.botLimit||s.maxBotsPerUser)+'</td><td>'+(u.banned?'<span class="pill bad">Banned</span>':'<span class="pill ok">Active</span>')+'</td>'+
      '<td><div class="row"><button class="g sm" data-limit="'+esc(u.u)+'">Limit</button><button class="'+(u.banned?'g':'r')+' sm" data-ban="'+esc(u.u)+'" data-act="'+(u.banned?'unban':'ban')+'">'+(u.banned?'Unban':'Ban')+'</button><button class="r sm" data-deluser="'+esc(u.u)+'">Delete</button></div></td></tr>').join('')+'</table>'+(list.length?'':'<p class="mut" style="padding:12px">Koi user nahi mila</p>')+'</div>';
  }
  if(P==='x'){
    h+='<div class="grid2"><div>'+
      '<div class="box"><h3>🔐 Access</h3>'+toggle('c_approvalRequired','Upload ke baad approval zaroori','Admin approve kare tabhi user Start kar payega',s.approvalRequired)+'<div style="height:10px"></div>'+
      toggle('c_signupOpen','Signup open',' ',s.signupOpen)+'<div style="height:10px"></div>'+toggle('c_maintenance','Maintenance mode','Login/upload band',s.maintenance)+'<div style="height:10px"></div>'+field('c_maintenanceMsg','Maintenance message',s.maintenanceMsg)+'</div>'+
      '<div class="box"><h3>🏷 Branding</h3>'+field('c_name','Website ka naam',s.name)+field('c_logo','Logo emoji',s.logo)+field('c_tagline','Tagline',s.tagline)+'<div class="f"><label>📣 Announcement banner (khali = hide)</label><input id="c_announcement" value="'+esc(s.announcement)+'"></div><div class="f"><label>🔗 Community links (har line: Title|https://link)</label><textarea id="c_links" rows="3" placeholder="Telegram Channel|https://t.me/xyz&#10;YouTube|https://youtube.com/@xyz">'+esc(s.links)+'</textarea></div></div></div>'+
      '<div><div class="box"><h3>📏 Limits</h3>'+field('c_maxBotsPerUser','Ek user ki max bots',s.maxBotsPerUser,'','number')+field('c_maxFileKB','Max file size (KB)',s.maxFileKB,'','number')+
      field('c_maxMemoryMB','Max RAM per bot (MB)',s.maxMemoryMB,'','number')+field('c_maxCpuSeconds','Lifetime CPU seconds per bot (0 = unlimited)',s.maxCpuSeconds,'','number')+field('c_maxUnzippedMB','ZIP khulne ke baad max size (MB)',s.maxUnzippedMB,'','number')+field('c_maxFiles','ZIP mein max files',s.maxFiles,'','number')+field('c_maxEnvVars','Max env variables per bot',s.maxEnvVars,'','number')+field('c_installTimeoutSec','Libraries install timeout (sec)',s.installTimeoutSec,'','number')+'</div>'+
      '<div class="box"><h3>♻️ Runtime</h3>'+toggle('c_autoRestart','Auto-restart on crash','Crash par bot khud restart (10 min mein max 6 baar)',s.autoRestart)+'</div>'+
      '<div class="box"><h3>🚫 Blocked imports</h3><div class="f"><label>Comma se alag. Ye modules import karne wale bots reject honge</label><input id="c_blockedImports" value="'+esc(s.blockedImports)+'"></div><p class="mut">In modules ko import karne wale scripts reject ho jayenge.</p></div></div></div>'+
      '<button id="sw">💾 Save karo</button>';
  }
  if(P==='a'){
    h+='<div class="row sb" style="margin-bottom:10px"><span class="mut">Last 200 events</span><button class="r sm" id="cl">Clear log</button></div><div class="box">'+(D.logs.map(l=>'<div class="log"><time>'+dt(l.t)+'</time><span>'+esc(l.msg)+'</span></div>').join('')||'<p class="mut">Abhi koi activity nahi</p>')+'</div>';
  }
  $('v').innerHTML=h;bind();
}

function bind(){
  const q=$('q');if(q)q.oninput=()=>{Q=q.value;const p=q.selectionStart;draw();const n=$('q');n.focus();n.setSelectionRange(p,p)};
  const sw=$('sw');if(sw)sw.onclick=()=>act({a:'savesettings',settings:{
    approvalRequired:gv('c_approvalRequired'),signupOpen:gv('c_signupOpen'),maintenance:gv('c_maintenance'),maintenanceMsg:gv('c_maintenanceMsg'),
    name:gv('c_name'),logo:gv('c_logo'),tagline:gv('c_tagline'),maxBotsPerUser:+gv('c_maxBotsPerUser'),maxFileKB:+gv('c_maxFileKB'),
    maxMemoryMB:+gv('c_maxMemoryMB'),maxCpuSeconds:+gv('c_maxCpuSeconds'),blockedImports:gv('c_blockedImports'),
    maxUnzippedMB:+gv('c_maxUnzippedMB'),maxFiles:+gv('c_maxFiles'),maxEnvVars:+gv('c_maxEnvVars'),installTimeoutSec:+gv('c_installTimeoutSec'),
    autoRestart:gv('c_autoRestart'),announcement:gv('c_announcement'),links:gv('c_links')
  }},null,'Settings save ho gayi ✔');
  $('v').querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>act({a:'approve',name:b.dataset.approve}));
  $('v').querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>act({a:'reject',name:b.dataset.reject},'Reject karke delete ho jayega. Pakka?'));
  $('v').querySelectorAll('[data-stopbot]').forEach(b=>b.onclick=()=>act({a:'stopbot',name:b.dataset.stopbot}));
  $('v').querySelectorAll('[data-startbot]').forEach(b=>b.onclick=()=>act({a:'startbot',name:b.dataset.startbot}));
  $('v').querySelectorAll('[data-delbot]').forEach(b=>b.onclick=()=>act({a:'delbot',name:b.dataset.delbot},'Bot delete karein?'));
  $('v').querySelectorAll('[data-logs]').forEach(b=>b.onclick=async()=>{const d=$('dlg');d.innerHTML='<h3>📜 '+esc(b.dataset.logs)+' logs</h3><pre class="logbox">loading…</pre><div class="row" style="margin-top:12px"><button class="g" id="dx">Close</button></div>';d.showModal();$('dx').onclick=()=>d.close();try{const j=await api('/api/admin/bots/'+b.dataset.logs+'/logs');d.querySelector('pre').textContent=j.log||'(khali hai)'}catch(e){d.querySelector('pre').textContent='Error: '+e.message}});
  $('v').querySelectorAll('[data-envk]').forEach(b=>b.onclick=async()=>{try{const j=await api('/api/admin/bots/'+b.dataset.envk+'/env');alert('Env variable NAAM (values admin ko nahi dikhte):\n\n'+(j.keys.join('\n')||'(koi nahi)'))}catch(e){toast(e.message,false)}});
  $('v').querySelectorAll('[data-ban]').forEach(b=>b.onclick=()=>act({a:b.dataset.act,u:b.dataset.ban},b.dataset.act==='ban'?'Ban karein? Saare bots bhi stop ho jayenge.':null));
  $('v').querySelectorAll('[data-deluser]').forEach(b=>b.onclick=()=>act({a:'deluser',u:b.dataset.deluser},'User aur uske saare bots delete ho jayenge. Pakka?'));
  $('v').querySelectorAll('[data-limit]').forEach(b=>b.onclick=()=>{const v=prompt('Is user ki bot limit (0 = default):');if(v!==null)act({a:'setlimit',u:b.dataset.limit,value:v})});
  const cl=$('cl');if(cl)cl.onclick=()=>act({a:'clearlog'},'Log clear karein?');
}
init();
</script>
</body>
</html>
